<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="sonyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#121824"/>
    </linearGradient>
    <linearGradient id="matteSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="sonyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#38bdf8" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#sonyBg)" rx="16"/>
  <circle cx="300" cy="200" r="130" fill="#38bdf8" opacity="0.08"/>

  <g filter="url(#sonyGlow)">
    <!-- Headband Arch -->
    <path d="M 190 220 C 180 80 420 80 410 220" fill="none" stroke="#475569" stroke-width="14" stroke-linecap="round"/>
    <path d="M 210 200 C 205 100 395 100 390 200" fill="none" stroke="#1e293b" stroke-width="10"/>

    <!-- Left Ear Cup -->
    <ellipse cx="180" cy="240" rx="36" ry="52" fill="url(#matteSilver)" stroke="#64748b" stroke-width="2"/>
    <ellipse cx="180" cy="240" rx="26" ry="40" fill="#0f172a"/>
    <!-- Gold accent dot -->
    <circle cx="180" cy="205" r="3" fill="#fbbf24"/>

    <!-- Right Ear Cup -->
    <ellipse cx="420" cy="240" rx="36" ry="52" fill="url(#matteSilver)" stroke="#64748b" stroke-width="2"/>
    <ellipse cx="420" cy="240" rx="26" ry="40" fill="#0f172a"/>
    <!-- Gold accent dot -->
    <circle cx="420" cy="205" r="3" fill="#fbbf24"/>
  </g>

  <!-- Spec Tag -->
  <rect x="195" y="375" width="210" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="300" y="396" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="700" font-size="13" text-anchor="middle">INDUSTRY-LEADING NC • 30HR</text>
</svg>
