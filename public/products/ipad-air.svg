<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ipadBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#141a29"/>
    </linearGradient>
    <linearGradient id="ipadScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="pencil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="ipadShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#8b5cf6" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#ipadBg)" rx="16"/>
  <circle cx="300" cy="210" r="140" fill="#8b5cf6" opacity="0.08"/>

  <g filter="url(#ipadShadow)">
    <!-- iPad Body -->
    <rect x="180" y="70" width="240" height="280" rx="22" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <!-- Screen Display -->
    <rect x="190" y="80" width="220" height="260" rx="16" fill="url(#ipadScreen)"/>
    
    <!-- Front camera -->
    <circle cx="300" cy="75" r="2.5" fill="#020617"/>
    
    <!-- Apple Pencil Pro magnetically attached -->
    <rect x="424" y="110" width="8" height="200" rx="4" fill="url(#pencil)"/>
    <polygon points="424,110 432,110 428,98" fill="#e2e8f0"/>
  </g>

  <!-- Spec Tag -->
  <rect x="210" y="380" width="180" height="32" rx="16" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
  <text x="300" y="401" fill="#c084fc" font-family="system-ui, sans-serif" font-weight="700" font-size="13" text-anchor="middle">11-INCH LIQUID RETINA</text>
</svg>
