<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="oled" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glowPhone" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#38bdf8" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#bg)" rx="16"/>
  
  <!-- Ambient backdrop -->
  <circle cx="300" cy="220" r="140" fill="#38bdf8" opacity="0.08"/>

  <!-- Phone Body -->
  <g filter="url(#glowPhone)">
    <!-- Chassis -->
    <rect x="220" y="70" width="160" height="290" rx="20" fill="url(#titanium)" stroke="#64748b" stroke-width="2"/>
    <!-- Display -->
    <rect x="226" y="76" width="148" height="278" rx="16" fill="url(#oled)"/>
    <!-- Hole punch camera -->
    <circle cx="300" cy="90" r="4" fill="#030712"/>
    <circle cx="300" cy="90" r="1.5" fill="#38bdf8"/>
    
    <!-- S-Pen Hint -->
    <rect x="390" y="140" width="8" height="150" rx="4" fill="url(#titanium)" stroke="#94a3b8" stroke-width="1"/>
    <polygon points="390,140 398,140 394,130" fill="#38bdf8"/>
  </g>

  <!-- Spec Tag -->
  <rect x="200" y="380" width="200" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="300" y="401" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="700" font-size="13" text-anchor="middle">200MP QUAD CAMERA • AI</text>
</svg>
