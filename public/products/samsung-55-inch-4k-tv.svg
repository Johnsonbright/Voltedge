<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="tvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="tvDisplay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="30%" stop-color="#8b5cf6"/>
      <stop offset="70%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="tvGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#8b5cf6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#tvBg)" rx="16"/>
  <ellipse cx="300" cy="210" rx="180" ry="110" fill="#8b5cf6" opacity="0.1"/>

  <g filter="url(#tvGlow)">
    <!-- TV Outer Bezel -->
    <rect x="80" y="70" width="440" height="248" rx="6" fill="#020617" stroke="#334155" stroke-width="3"/>
    <!-- TV Display Screen -->
    <rect x="86" y="76" width="428" height="236" rx="3" fill="url(#tvDisplay)"/>
    
    <!-- Cinematic Mountain / City silhouette inside screen -->
    <polygon points="86,312 180,240 260,280 340,210 420,270 514,312" fill="#020617" opacity="0.5"/>
    <circle cx="430" cy="140" r="28" fill="#fef08a" opacity="0.8"/>

    <!-- AirSlim Center Stand -->
    <polygon points="260,318 340,318 360,350 240,350" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  </g>

  <!-- Spec Tag -->
  <rect x="180" y="380" width="240" height="32" rx="16" fill="#1e293b" stroke="#ec4899" stroke-width="1"/>
  <text x="300" y="401" fill="#f472b6" font-family="system-ui, sans-serif" font-weight="700" font-size="13" text-anchor="middle">55" CRYSTAL 4K • HDR10+ SMART</text>
</svg>
