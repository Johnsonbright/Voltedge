<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="mouseBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="mouseBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="metalWheel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="mouseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#10b981" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#mouseBg)" rx="16"/>
  <circle cx="300" cy="210" r="130" fill="#10b981" opacity="0.08"/>

  <g filter="url(#mouseGlow)">
    <!-- Ergonomic Mouse Body Silhouette -->
    <path d="M 230 180 C 220 100 380 100 370 180 C 375 270 360 330 300 335 C 240 330 225 270 230 180 Z" fill="url(#mouseBody)" stroke="#475569" stroke-width="2"/>
    
    <!-- Left / Right Click Split -->
    <path d="M 300 110 L 300 200" stroke="#020617" stroke-width="2"/>
    
    <!-- MagSpeed Scroll Wheel -->
    <rect x="292" y="130" width="16" height="38" rx="6" fill="url(#metalWheel)" stroke="#0f172a" stroke-width="1.5"/>

    <!-- Gesture Thumb Rest on Left -->
    <path d="M 230 190 C 200 220 200 270 232 290 Z" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    
    <!-- LED indicator -->
    <circle cx="300" cy="225" r="2.5" fill="#10b981"/>
  </g>

  <!-- Spec Tag -->
  <rect x="195" y="375" width="210" height="32" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="300" y="396" fill="#34d399" font-family="system-ui, sans-serif" font-weight="700" font-size="13" text-anchor="middle">MAGSPEED • 8K DPI SENSOR</text>
</svg>
