<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bankBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c14"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="bankBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="bankGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#bankBg)" rx="16"/>
  <circle cx="300" cy="210" r="130" fill="#f59e0b" opacity="0.08"/>

  <g filter="url(#bankGlow)">
    <!-- Power Bank Pillar Body -->
    <rect x="220" y="80" width="160" height="260" rx="18" fill="url(#bankBody)" stroke="#475569" stroke-width="2"/>
    
    <!-- Smart Color Digital Display Screen -->
    <rect x="236" y="100" width="128" height="90" rx="10" fill="#020617" stroke="#334155" stroke-width="1.5"/>
    <!-- Battery Level Graphic -->
    <text x="300" y="145" fill="#10B981" font-family="system-ui, sans-serif" font-weight="800" font-size="28" text-anchor="middle">100%</text>
    <text x="300" y="170" fill="#94A3B8" font-family="system-ui, sans-serif" font-weight="600" font-size="12" text-anchor="middle">140W ULTRA-FAST</text>

    <!-- USB-C Port 1 -->
    <rect x="250" y="220" width="40" height="12" rx="4" fill="#020617" stroke="#00F0FF" stroke-width="1"/>
    <!-- USB-C Port 2 -->
    <rect x="310" y="220" width="40" height="12" rx="4" fill="#020617" stroke="#00F0FF" stroke-width="1"/>
    <!-- USB-A Port -->
    <rect x="265" y="255" width="70" height="16" rx="3" fill="#020617" stroke="#64748b" stroke-width="1"/>
  </g>

  <!-- Spec Tag -->
  <rect x="195" y="375" width="210" height="32" rx="16" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="300" y="396" fill="#fbbf24" font-family="system-ui, sans-serif" font-weight="700" font-size="13" text-anchor="middle">24,000mAh • 140W PD 3.1</text>
</svg>
