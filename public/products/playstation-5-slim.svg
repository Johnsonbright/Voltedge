<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="psBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#121829"/>
    </linearGradient>
    <linearGradient id="whitePlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="psBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#006FCD"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <filter id="psGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#006FCD" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#psBg)" rx="16"/>
  <circle cx="300" cy="210" r="130" fill="#006FCD" opacity="0.12"/>

  <!-- PS5 Slim Console Representation -->
  <g filter="url(#psGlow)">
    <!-- Inner Black Core -->
    <rect x="270" y="75" width="60" height="270" rx="8" fill="#020617"/>
    
    <!-- Left Plate Wing -->
    <path d="M 270 70 C 240 100 235 220 250 345 L 270 345 Z" fill="url(#whitePlate)"/>
    <!-- Right Plate Wing -->
    <path d="M 330 70 C 360 100 365 220 350 345 L 330 345 Z" fill="url(#whitePlate)"/>

    <!-- Center LED Accent Strip -->
    <path d="M 273 80 L 273 340" stroke="url(#psBlue)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 327 80 L 327 340" stroke="url(#psBlue)" stroke-width="3" stroke-linecap="round"/>

    <!-- Stand Base -->
    <ellipse cx="300" cy="350" rx="65" ry="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  </g>

  <!-- Spec Tag -->
  <rect x="210" y="380" width="180" height="32" rx="16" fill="#1e293b" stroke="#00F0FF" stroke-width="1"/>
  <text x="300" y="401" fill="#00F0FF" font-family="system-ui, sans-serif" font-weight="700" font-size="13" text-anchor="middle">1TB SSD • 4K 120Hz HDR</text>
</svg>
